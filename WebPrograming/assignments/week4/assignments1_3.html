
<!DOCTYPE html><html>
  <head>
    <title>CSS3 Property Basic</title>
    <!--숨김-->
    <!-- none과는 다름 -->
     <!-- none은 출력하지 않으면서, 영역도 차지 하지 않음. -->
     <!-- hidden은 출력하지 않으면서, 영역은 처리함 -->
    <style>
      #box {
        visibility: hidden;
      }
    </style>
  </head>
  <body>
    <span>Dummy</span>
    <div id="box">
      <span>Lorem ipsum dolor sit amet, consectetur adipiscing elit.</span>
    </div>
    <span>Dummy</span>
  </body>
</html>
