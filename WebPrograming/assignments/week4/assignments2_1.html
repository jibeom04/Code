<!DOCTYPE html>
<html>
  <head>
      <title>CSS Property Basic</title>
      <!-- 너비, 높이 100px -->
      <!-- 배경색상 빨강 -->
      <!-- 선두께 20px, 선 스타일 실선, 선 색상 검정-->
      <!--마진(외부) 10px, padding(내부) 30px) -->
      <style>
          div {
              width: 100px; height: 100px;
              background-color: red;
              border: 20px solid black;
              margin: 10px; padding: 30px;
          }
     </style>
  </head>
  <body>
      <div></div>
  </body>
</html>
