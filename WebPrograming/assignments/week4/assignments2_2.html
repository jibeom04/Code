<!DOCTYPE html>
<html>
  <head>
      <title>CSS3 Property Basic</title>
      <!-- border-radius : 테두리 둥글게 처리,  값이 작을 수록 사각형,  값이 클수록 둥근 사각형 -->
      <style>
          .box {
              border: thick dashed black;
              border-radius: 20px;
          }
      </style>
  </head>
  <body>
      <div class="box">
          <h1>Lorem ipsum dolor amet</h1>
      </div>
  </body>
</html>
